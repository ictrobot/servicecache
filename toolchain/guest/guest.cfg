# Every flag a guest's compile and link depend on. An option prefixed with
# $ is passed only when linking, and after everything the caller gave on
# the command line, so the startup object and libraries follow the caller's
# objects.
--target=wasm32-wasip1
--sysroot=@sysroot@
-resource-dir=@resource@
-B@linker-dir@/
--no-wasm-opt

# Features the runtime supports and every guest is built for.
-matomics -mbulk-memory -mmutable-globals
-msimd128 -mrelaxed-simd -mextended-const -mwide-arithmetic

# Threads, their storage in a module that is never relocated, and
# exceptions and setjmp/longjmp as WebAssembly exceptions.
-pthread
-ftls-model=local-exec
-fwasm-exceptions
-mllvm --wasm-enable-sjlj
-mllvm --wasm-use-legacy-eh=false
-fno-trapping-math

# The C library's emulations of calls WASI has no counterpart for.
-D_WASI_EMULATED_MMAN -D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_PROCESS_CLOCKS

# Link settings a build may override. The name section keeps each symbol's
# name as the objects spell it, mangled for C++; the option has one dash,
# because clang keeps --no-demangle to itself and gives a wasm32 link none.
-Wl,--import-memory -Wl,--max-memory=4294967296
-Wl,-z,stack-size=8388608
-Wl,--strip-debug -Wl,-no-demangle
-Wl,--export=__wasm_call_ctors -Wl,--export=__wasm_init_tls -Wl,--export=__wasm_signal
-Wl,--export=__tls_size -Wl,--export=__tls_align -Wl,--export=__tls_base
-Wl,--export-if-defined=__indirect_function_table -Wl,--export-if-defined=__stack_pointer
-Wl,--export-if-defined=__heap_base -Wl,--export-if-defined=__data_end

# The startup file and the libraries every guest links, after its objects.
-nostartfiles $@sysroot@/lib/wasm32-wasip1/crt1.o
$-lwasi-emulated-getpid $-lwasi-emulated-mman $-lwasi-emulated-process-clocks
$-lresolv $-lrt $-lm $-lutil $-lunwind
