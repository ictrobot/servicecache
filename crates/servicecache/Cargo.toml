[package]
name = "servicecache"
description = "Fast disposable services for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
nix = { version = "0.29", features = ["fs", "poll", "process", "signal", "socket", "uio"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.39", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# TODO(upstream): Track Wasmer's migration from the unmaintained proc-macro-error2 crate:
# https://github.com/wasmerio/wasmer/issues/6692
wasmer = { version = "=7.3.0", default-features = false, features = ["cranelift"] }
wasmer-types = "=7.3.0"
wasmer-vm = { version = "=7.3.0", features = ["tracing"] }
wasmer-wasix = { version = "=0.703.0", default-features = false, features = ["host-fs", "host-vnet", "sys-minimal"] }
virtual-fs = { version = "=0.703.0", default-features = false, features = ["host-fs"] }
virtual-mio = { version = "=0.703.0", default-features = false, features = ["sys"] }
virtual-net = { version = "=0.703.0", default-features = false, features = ["host-net"] }

[dev-dependencies]
libtest-mimic = "0.8"

# One trial per built service and case, discovered at run time, so that the
# harness (or nextest) runs them in parallel.
[[test]]
name = "host"
harness = false

[[test]]
name = "lifecycle"
harness = false

[[test]]
name = "serve"
harness = false

[lints]
workspace = true
