[package]
name = "servicecache"
description = "Fast disposable services for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.39", features = ["rt-multi-thread"] }
toml = "0.9"
# TODO(upstream): Track Wasmer's migration from the unmaintained proc-macro-error2 crate:
# https://github.com/wasmerio/wasmer/issues/6692
wasmer = { version = "=7.3.0", default-features = false, features = ["cranelift"] }
wasmer-wasix = { version = "=0.703.0", default-features = false, features = ["host-fs", "sys-minimal"] }

[lints]
workspace = true
