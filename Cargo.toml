[workspace]
resolver = "3"
members = ["crates/servicecache"]
exclude = ["work"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.lints.clippy]
pedantic = "warn"

# The host process embeds the servicecache wasmer variant (see wasmer/README).
# Every crate the lockfile pulls from the Wasmer workspace is overridden from
# that tree: a partial override fails with duplicate types.
[patch.crates-io]
virtual-fs = { path = "work/src/wasmer/servicecache/lib/virtual-fs" }
virtual-mio = { path = "work/src/wasmer/servicecache/lib/virtual-io" }
virtual-net = { path = "work/src/wasmer/servicecache/lib/virtual-net" }
wasmer = { path = "work/src/wasmer/servicecache/lib/api" }
wasmer-compiler = { path = "work/src/wasmer/servicecache/lib/compiler" }
wasmer-compiler-cranelift = { path = "work/src/wasmer/servicecache/lib/compiler-cranelift" }
wasmer-config = { path = "work/src/wasmer/servicecache/lib/config" }
wasmer-derive = { path = "work/src/wasmer/servicecache/lib/derive" }
wasmer-journal = { path = "work/src/wasmer/servicecache/lib/journal" }
wasmer-package = { path = "work/src/wasmer/servicecache/lib/package" }
wasmer-types = { path = "work/src/wasmer/servicecache/lib/types" }
wasmer-vm = { path = "work/src/wasmer/servicecache/lib/vm" }
wasmer-wasix = { path = "work/src/wasmer/servicecache/lib/wasix" }
wasmer-wasix-types = { path = "work/src/wasmer/servicecache/lib/wasi-types" }

# Line tables in the bench profile (`cargo build --profile bench`: the same
# code as release, in the same directory), so that perf attributes samples to
# functions and lines of this crate and the Wasmer crates. Release builds
# stay as they are.
[profile.bench]
debug = "line-tables-only"
