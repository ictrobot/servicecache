## OpenSSL target for the WASIX build, selected by build.sh with
## Configure --config=wasix.conf wasix-wasm32.
my %targets = (
    "wasix-wasm32" => {
        # Otherwise OpenSSL's generic 32-bit Linux target: pthreads, and also
        # -ldl, dlfcn module loading and Linux shared-library settings, which
        # build.sh's -static no-shared no-dso leave unused. Its compiler
        # defaults are replaced by the build's CC and CFLAGS.
        inherit_from => [ "linux-generic32" ],
        # WebAssembly memory is little-endian. OpenSSL's little-endian targets
        # state it too; the files that test L_ENDIAN do not work it out.
        lib_cppflags => add("-DL_ENDIAN"),
        # 64-bit bignum words. A long is 32 bits on wasm32, so the word is
        # unsigned long long (SIXTY_FOUR_BIT), not SIXTY_FOUR_BIT_LONG.
        # RC4_CHAR is linux-generic32's own setting.
        bn_ops       => "SIXTY_FOUR_BIT RC4_CHAR",
        # Not an architecture. Keep OPENSSL_NO_ASM undefined: OpenSSL places
        # its C unsigned __int128 bignum multiplication helpers behind the
        # same guard. No build.info selector in the pinned OpenSSL tree
        # recognises this value, so no assembly source is selected; check the
        # selectors again when upgrading OpenSSL.
        asm_arch     => "_placeholder_enable_int128_multiply",
        # OpenSSL's 64-bit implementations of the NIST prime curves (P-224,
        # P-256, P-384, P-521), on the same 128-bit type; off unless a target
        # or Configure enables it.
        enable       => add("ec_nistp_64_gcc_128"),
    },
);
